<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     width="500.0px"
     height="500.0px"
     viewBox="0 0 500 500"
     xml:space="preserve">

<g transform="translate(250 250)">

    <!-- torso: changed from square to vertical rectangle -->
    <g transform="scale(0.8 1.3)">
        <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50"/>
        <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
    </g>

    <!-- head -->
    <g transform="translate(0 -100)">
        <g transform="scale(.5 .5)">
            <polygon fill="#3B82F6" points="-50,-50 50,-50 -50,50"/>
            <polygon fill="#3B82F6" points="-50,50 50,-50 50,50"/>
        </g>
    </g>

    <!-- left leg: straight -->
    <g transform="translate(-18 110)">
        <g transform="scale(.18 .7)">
            <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50"/>
            <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
        </g>
        <g transform="translate(0 80)">
            <g transform="scale(.18 .7)">
                <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50"/>
                <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
            </g>
        </g>
    </g>

    <!-- right leg: straight -->
    <g transform="translate(18 110)">
        <g transform="scale(.18 .7)">
            <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50"/>
            <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
        </g>
        <g transform="translate(0 80)">
            <g transform="scale(.18 .7)">
                <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50"/>
                <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
            </g>
        </g>
    </g>

    <!-- left arm: straight down close to body -->
    <g transform="translate(-58 -25)">
        <g transform="rotate(90)">
            <g transform="scale(.55 .18)">
                <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50"/>
                <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
            </g>
        </g>

        <g transform="translate(0 60)">
            <g transform="rotate(90)">
                <g transform="scale(.55 .18)">
                    <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50"/>
                    <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
                </g>
            </g>
        </g>
    </g>

    <!-- right arm: salute -->
    <g transform="translate(55 -55)">
        <!-- upper arm angled upward -->
        <g transform="rotate(-55)">
            <g transform="scale(.55 .18)">
                <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50"/>
                <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
            </g>

            <!-- forearm bent toward temple -->
            <g transform="translate(42 -12)">
                <g transform="rotate(-95)">
                    <g transform="scale(.5 .16)">
                        <polygon fill="#EF161F" points="-50,-50 50,-50 -50,50"/>
                        <polygon fill="#EF161F" points="-50,50 50,-50 50,50"/>
                    </g>
                </g>
            </g>
        </g>
    </g>

</g>

</svg>